apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-centric
spec:
  replicas: 4
  selector:
    matchLabels:
      app: db-centric
  template:
    metadata:
      labels:
        app: db-centric
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db-centric-postgres 5432; do sleep 2; done"]
      containers:
        - name: processor
          image: order-lifecycle-db-centric:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              value: jdbc:postgresql://db-centric-postgres:5432/order_lifecycle
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-centric-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-centric-postgres
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-broker:29092
            - name: SOURCE_ID
              value: k8s-executions-v1
            - name: DB_CONSUMERS
              value: "1"
            - name: DB_POOL_SIZE
              value: "4"
            - name: POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
