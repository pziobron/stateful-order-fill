services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: order_lifecycle
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d order_lifecycle"]
      interval: 5s
      timeout: 5s
      retries: 12

  processor:
    build:
      context: ..
      dockerfile: db-centric/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_lifecycle
      DB_USER: orders
      DB_PASSWORD: orders-local
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SOURCE_ID: compose-executions-v1
      POD_ID: db-centric-compose
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - kafka-network

volumes:
  postgres-data:

networks:
  kafka-network:
    external: true
    name: kafka-streams_kafka-network
