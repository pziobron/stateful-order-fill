apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  labels:
    app: order-lifecycle-flink
    component: jobmanager
spec:
  type: ClusterIP
  selector:
    app: order-lifecycle-flink
    component: jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123

    - name: blob
      port: 6124
      targetPort: 6124

    - name: rest
      port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  labels:
    app: order-lifecycle-flink
    component: jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-lifecycle-flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: order-lifecycle-flink
        component: jobmanager
    spec:
      containers:
        - name: jobmanager
          image: order-lifecycle-flink:latest
          imagePullPolicy: Never
          args:
            - jobmanager

          ports:
            - name: rpc
              containerPort: 6123

            - name: blob
              containerPort: 6124

            - name: rest
              containerPort: 8081

          env:
            - name: FLINK_PROPERTIES
              valueFrom:
                configMapKeyRef:
                  name: order-lifecycle-flink-config
                  key: flink-properties

            - name: ROOT_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: order-lifecycle-flink-config
                  key: ROOT_LOG_LEVEL

            - name: FLINK_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: order-lifecycle-flink-config
                  key: FLINK_LOG_LEVEL

            - name: KAFKA_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: order-lifecycle-flink-config
                  key: KAFKA_LOG_LEVEL

            - name: PEKKO_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: order-lifecycle-flink-config
                  key: PEKKO_LOG_LEVEL

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1280Mi"

          readinessProbe:
            httpGet:
              path: /overview
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /overview
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          volumeMounts:
            - name: flink-log-config
              mountPath: /opt/flink/conf/log4j-console.properties
              subPath: log4j-console.properties
              readOnly: true

      volumes:
        - name: flink-log-config
          configMap:
            name: order-lifecycle-flink-config
            items:
              - key: log4j-console.properties
                path: log4j-console.properties
