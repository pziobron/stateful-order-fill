apiVersion: batch/v1
kind: Job
metadata:
  name: integration-test
  labels:
    app: integration-test
spec:
  template:
    metadata:
      labels:
        app: integration-test
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo 'Waiting for Kafka broker to be ready...'
              until nc -z kafka-broker 29092; do
                echo 'Kafka not ready yet, waiting...'
                sleep 5
              done
              echo 'Kafka is ready!'
      containers:
        - name: test-runner
          image: order-state-processor-test:latest
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "3Gi"

          env:
            - name: TEST_ITERATIONS
              value: "100000"
          command:
            - ./gradlew

          args:
            - :kafka-streams:test
            - -PincludeIntegrationTests
            - -PtestMaxHeap=1g
            - -Dkafka.bootstrapServers=kafka-broker:29092
            - --tests
            - org.example.order.lifecycle.processor.integration.OrderLifecycleKafkaScenarioTest.testParentOrderFill
            - --no-daemon
            - --info
  backoffLimit: 0
